# ضع الملف في: .github/workflows/main.yml
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يجد مجلد المشروع (الذي فيه lib/main.dart) ويكمل الملفات الناقصة
      # (pubspec.yaml و android/) تلقائياً دون المساس بملفاتك.
      - name: Locate and bootstrap Flutter project
        run: |
          set -e
          find_main() { find . -path ./.git -prune -o -path '*/lib/main.dart' -print | head -n1; }
          MAIN=$(find_main)
          # إن رُفع المشروع كملف zip داخل المستودع، نفكّه تلقائياً
          if [ -z "$MAIN" ]; then
            for z in $(find . -maxdepth 3 -name '*.zip' -not -path './.git/*'); do
              unzip -oq "$z" -d _extracted || true
            done
            MAIN=$(find_main)
          fi
          if [ -z "$MAIN" ]; then
            echo "::error::lib/main.dart not found. Repository contents:"
            find . -path ./.git -prune -o -type f -print | head -n 60
            exit 1
          fi
          APP_DIR=$(dirname "$(dirname "$MAIN")")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"

          GEN_PUBSPEC=0
          [ -f pubspec.yaml ] || GEN_PUBSPEC=1
          if [ ! -f pubspec.yaml ] || [ ! -d android ]; then
            flutter create --project-name apk_server --org com.example /tmp/proj
            cp -rn /tmp/proj/. .
          fi
          if [ "$GEN_PUBSPEC" = 1 ]; then
            rm -rf test
            flutter pub add shelf:^1.4.1 file_picker:^8.1.2 qr_flutter:^4.1.0 \
              network_info_plus:^6.0.0 connectivity_plus:^6.0.5 path_provider:^2.1.4 \
              flutter_foreground_task:^8.17.0 dartssh2:^2.10.0 google_fonts:^6.2.1
          fi

      - name: Verify source files
        working-directory: ${{ env.APP_DIR }}
        run: |
          missing=0
          for f in lib/main.dart lib/core/format.dart lib/models/apk_app.dart \
            lib/models/tunnel_config.dart lib/services/apk_reader.dart \
            lib/services/storage.dart lib/services/web_server.dart \
            lib/services/background.dart lib/services/tunnel.dart \
            lib/state/app_store.dart lib/ui/theme.dart lib/ui/widgets.dart \
            lib/ui/upload.dart lib/ui/pages/shell.dart \
            lib/ui/pages/dashboard_page.dart lib/ui/pages/detail_page.dart \
            lib/ui/pages/versions_page.dart lib/ui/pages/settings_page.dart \
            lib/ui/pages/tunnel_settings_page.dart lib/core/i18n.dart \
            lib/models/app_prefs.dart lib/ui/i18n.dart lib/core/net.dart \
            lib/services/server_runtime.dart lib/services/task_handler.dart \
            lib/ui/brand.dart lib/ui/splash_page.dart \
            lib/ui/brand_assets.dart; do
            if [ ! -f "$f" ]; then echo "::error::missing file: $f"; missing=1; fi
          done
          exit $missing

      # flutter_foreground_task 8.17 لا يدعم الوسيط serviceTypes (النوع يُقرأ من المانيفست)
      - name: Compatibility patch
        working-directory: ${{ env.APP_DIR }}
        run: sed -i '/serviceTypes:/d' lib/services/background.dart

      # مفتاح النفق المجهول يُولَّد وقت البناء، فلا حاجة لرفعه إلى المستودع
      - name: Generate tunnel key
        working-directory: ${{ env.APP_DIR }}
        run: |
          F=lib/services/tunnel_key.dart
          if [ ! -f "$F" ]; then
            ssh-keygen -q -t ed25519 -N "" -C "apk-server-tunnel" -f /tmp/tk
            { echo "// generated at build time"; echo "const kTunnelKey = '''"; cat /tmp/tk; echo "''';"; } > "$F"
          fi

      # يضيف كود أندرويد (قراءة الـ APK) وصلاحيات الخدمة الأمامية
      - name: Apply Android files
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          PKG=$(grep -ohP 'namespace\s*=?\s*"\K[^"]+' android/app/build.gradle* | head -n1)
          DIR="android/app/src/main/kotlin/$(echo "$PKG" | tr . /)"
          find android/app/src/main -name 'MainActivity.*' -delete
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.kt" <<'KT'
          package com.example.apk_server

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.Drawable
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.FileOutputStream

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "apk_reader")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "read") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val path = call.argument<String>("path")!!
                          val iconOut = call.argument<String>("iconOut")!!
                          Thread {
                              try {
                                  val pm = packageManager
                                  val info = pm.getPackageArchiveInfo(path, 0)
                                  val ai = info?.applicationInfo
                                  if (info == null || ai == null) {
                                      runOnUiThread { result.error("BAD_APK", "ملف APK غير صالح", null) }
                                      return@Thread
                                  }
                                  ai.sourceDir = path
                                  ai.publicSourceDir = path
                                  val label = ai.loadLabel(pm).toString()
                                  val bmp = toBitmap(ai.loadIcon(pm))
                                  FileOutputStream(iconOut).use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                                  val code = if (Build.VERSION.SDK_INT >= 28) info.longVersionCode
                                             else info.versionCode.toLong()
                                  val map = hashMapOf<String, Any>(
                                      "name" to label,
                                      "package" to info.packageName,
                                      "versionName" to (info.versionName ?: code.toString()),
                                      "versionCode" to code
                                  )
                                  runOnUiThread { result.success(map) }
                              } catch (e: Exception) {
                                  runOnUiThread { result.error("READ_FAILED", e.message, null) }
                              }
                          }.start()
                      }
              }

              private fun toBitmap(d: Drawable): Bitmap {
                  if (d is BitmapDrawable && d.bitmap != null) return d.bitmap
                  val w = if (d.intrinsicWidth > 0) d.intrinsicWidth else 192
                  val h = if (d.intrinsicHeight > 0) d.intrinsicHeight else 192
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  d.setBounds(0, 0, c.width, c.height)
                  d.draw(c)
                  return bmp
              }
          }
          KT
          sed -i "s/^package .*/package $PKG/" "$DIR/MainActivity.kt"
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'FOREGROUND_SERVICE_SPECIAL_USE' not in s:
              perms = ''.join(
                  f'    <uses-permission android:name="android.permission.{n}"/>\n'
                  for n in ['INTERNET', 'ACCESS_WIFI_STATE', 'ACCESS_NETWORK_STATE',
                            'WAKE_LOCK', 'POST_NOTIFICATIONS', 'FOREGROUND_SERVICE',
                            'FOREGROUND_SERVICE_SPECIAL_USE',
                            'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS'])
              svc = ('    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
                     '        android:foregroundServiceType="specialUse" android:exported="false">\n'
                     '        <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n'
                     '            android:value="personal_http_server"/>\n'
                     '    </service>\n')
              s = s.replace('<application', perms + '    <application', 1)
              s = s.replace('</application>', svc + '    </application>', 1)
              open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Restore signing key (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      # يضمن وجود كل الحزم المطلوبة حتى لو كان pubspec.yaml موجوداً في المستودع (ينقص منه ما لم يُضَف بعد)
      - name: Ensure required packages
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          for spec in shelf:^1.4.1 file_picker:^8.1.2 qr_flutter:^4.1.0 network_info_plus:^6.0.0 \
                      connectivity_plus:^6.0.5 path_provider:^2.1.4 flutter_foreground_task:^8.17.0 \
                      dartssh2:^2.10.0 google_fonts:^6.2.1; do
            name=${spec%%:*}
            if ! grep -qE "^[[:space:]]+$name:" pubspec.yaml; then
              echo "adding $spec"
              flutter pub add "$spec"
            fi
          done
          # google_fonts 9 مبني على material_ui فيتعارض نوع TextTheme مع flutter/material؛ نثبّت الإصدار 6
          flutter pub add google_fonts:^6.3.0


      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: App name
        working-directory: ${{ env.APP_DIR }}
        run: sed -i 's/android:label="[^"]*"/android:label="Apk Server"/' android/app/src/main/AndroidManifest.xml

      # أيقونة التطبيق وشاشة البداية الأصلية. نأخذ من المستودع صور PNG فقط،
      # أما ملفات XML فتُكتب هنا (لا تتأثر بأخطاء الرفع) وكل جزء ناقص يُتخطّى بتحذير بدل أن يكسر البناء.
      - name: Apply branding resources
        working-directory: ${{ env.APP_DIR }}
        run: |
          RES=android/app/src/main/res
          if [ ! -d android_res ]; then echo "::warning::android_res not found, keeping default icon/splash"; exit 0; fi
          # ملفات بأسماء غير صالحة (مثل D و V) تكسر aapt، فنحذفها؛ و XML نكتبه بأنفسنا
          find android_res -type f ! -name '*.png' -print -delete
          mkdir -p "$RES/values"

          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0A1830</color>
          </resources>
          XML

          # ── الأيقونة ──
          if [ -f android_res/mipmap-xxxhdpi/ic_launcher.png ] && [ -f android_res/mipmap-hdpi/ic_launcher.png ]; then
            find "$RES" -name 'ic_launcher*' -not -path '*/values/*' -delete
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES/$d"
              cp -f android_res/$d/ic_launcher.png "$RES/$d/" 2>/dev/null || true
              cp -f android_res/$d/ic_launcher_foreground.png "$RES/$d/" 2>/dev/null || true
            done
            if [ -f "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png" ] && [ -f "$RES/mipmap-mdpi/ic_launcher_foreground.png" ]; then
              mkdir -p "$RES/mipmap-anydpi-v26"
              cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
            fi
          else
            echo "::warning::launcher icon PNG files missing in android_res, keeping default icon"
          fi

          # ── شاشة البداية الأصلية ──
          if [ -f android_res/drawable-nodpi/splash_mark.png ]; then
            mkdir -p "$RES/drawable-nodpi"
            cp -f android_res/drawable-nodpi/splash_mark.png "$RES/drawable-nodpi/"
            for d in drawable drawable-v21 drawable-night drawable-night-v21; do
              mkdir -p "$RES/$d"
              cat > "$RES/$d/launch_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/ic_launcher_background" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/splash_mark" />
              </item>
          </layer-list>
          XML
            done
            for pair in "values-v31:Theme.Light.NoTitleBar" "values-night-v31:Theme.Black.NoTitleBar"; do
              d=${pair%%:*}; parent=${pair##*:}
              mkdir -p "$RES/$d"
              cat > "$RES/$d/styles.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/$parent">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowSplashScreenBackground">@color/ic_launcher_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_mark</item>
                  <item name="android:forceDarkAllowed">false</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="NormalTheme" parent="@android:style/$parent">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          XML
            done
          else
            echo "::warning::splash_mark.png missing, keeping default splash"
          fi
          echo "res folders:"; ls "$RES"

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # file_picker مبني على android-34 بينما flutter_plugin_android_lifecycle يتطلب 36 فأكثر،
      # فنرفع compileSdk لكل الإضافات عبر Gradle init script (يعمل مع أي نوع build.gradle)
      - name: Force compileSdk 36 for all modules
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              def ext = p.extensions.findByName('android')
              if (ext != null) {
                def cur = ext.compileSdk
                if (cur == null || cur < 36) { ext.compileSdk = 36 }
              }
            }
          }
          GRADLE

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
